name: ci

on:
  push:
  pull_request:

jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH
          # the registry index is not present on a fresh runner
          "$HOME/.moon/bin/moon" update
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Check, format, interfaces, fixtures, tests on js / native
        run: scripts/verify.sh
      - name: Wasm artifact, size comparison, render diff, speed
        run: |
          pnpm install --frozen-lockfile
          scripts/build-wasm.sh
          moon build --target native --release -q
          packages/compare/compare.sh
          node packages/compare/render-diff.mjs
          node packages/compare/wasm-speed.mjs
      - name: Website builds (Rabbita app, js backend)
        run: |
          moon install moonbit-community/warren
          MOON_WORK=off moon -C svgo doc
          node app/website/build.mjs
      - name: Benchmarks (native)
        if: matrix.os == 'macos-latest'
        run: scripts/bench.sh
