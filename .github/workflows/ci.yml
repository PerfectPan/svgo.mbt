name: ci

on:
  push:
  pull_request:

jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check, format, interfaces, fixtures, tests on wasm-gc / js / native
        run: scripts/verify.sh
      - name: Wasm artifact, size comparison, render diff, speed
        run: |
          scripts/build-wasm.sh
          moon build --target native --release -q
          cd harness && npm install --no-audit --no-fund && cd ..
          harness/compare.sh
          node harness/render-diff.mjs
          node harness/wasm-speed.mjs
      - name: Benchmarks (native)
        if: matrix.os == 'macos-latest'
        run: scripts/bench.sh
