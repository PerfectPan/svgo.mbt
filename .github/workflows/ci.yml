name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH
      - name: Check
        run: moon check
      - name: Format check
        run: moon fmt --check
      - name: Test (wasm-gc)
        run: moon test --target wasm-gc
      - name: Test (js)
        run: moon test --target js
      - name: Test (native)
        run: moon test --target native
      - name: Build wasm artifact
        run: scripts/build-wasm.sh
      - name: Size benchmark against svgo
        run: harness/compare.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Render diff (resvg + pixelmatch)
        run: |
          cd harness && npm install --no-audit --no-fund && cd ..
          node harness/render-diff.mjs
          node harness/wasm-speed.mjs
