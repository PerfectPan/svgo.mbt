name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH
          # the registry index is not present on a fresh runner
          "$HOME/.moon/bin/moon" update
          "$HOME/.moon/bin/moon" install moonbit-community/warren
      # pnpm (the `packageManager` version) and Node.js; also runs the frozen
      # `pnpm install`
      - uses: pnpm/setup@v3
        with:
          runtime: node@24
          cache: true
          require-lockfile: true
      - name: Build wasm, API docs and the site
        run: |
          scripts/build-wasm.sh
          MOON_WORK=off moon -C svgo doc
          node app/website/build.mjs
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _build/app

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
