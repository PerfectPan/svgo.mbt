name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH
          # the registry index is not present on a fresh runner
          "$HOME/.moon/bin/moon" update
          "$HOME/.moon/bin/moon" install moonbit-community/warren
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Build wasm, API docs and the site
        run: |
          pnpm install --frozen-lockfile
          scripts/build-wasm.sh
          MOON_WORK=off moon -C svgo doc
          node app/website/build.mjs
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _build/app

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
