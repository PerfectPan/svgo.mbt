name: release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and test the npm package without publishing or tagging"
        type: boolean
        default: true

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && inputs.dry_run)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/setup@v3
        with:
          runtime: node@24
          cache: true
          require-lockfile: true
      - uses: changesets/action/select-mode@v2.1.2
        id: mode
        if: github.event_name == 'push'

      # Versioning refreshes the MoonBit interfaces; publication builds the wasm module and CLI.
      - name: Install MoonBit
        if: github.event_name == 'workflow_dispatch' || steps.mode.outputs.mode != 'none'
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
          "$HOME/.moon/bin/moon" update
      - uses: changesets/action/version@v2.1.2
        if: steps.mode.outputs.mode == 'version'
        with:
          script: pnpm version-packages
          commit-message: "chore(release): version packages"
          pr-title: "chore(release): version packages"
          pr-draft: always

      - name: Build and test the npm package
        if: github.event_name == 'workflow_dispatch' || steps.mode.outputs.mode == 'publish'
        run: |
          node scripts/sync-version.mjs --check
          scripts/build-wasm.sh
          scripts/build-cli.sh
          cd packages/svgo-mbt && node --test
      - name: Rehearse publishing
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        working-directory: packages/svgo-mbt
        run: pnpm publish --dry-run --ignore-scripts --access public --no-git-checks
      - uses: changesets/action/publish@v2.1.2
        id: publish
        if: steps.mode.outputs.mode == 'publish' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run)
      # Tags created with GITHUB_TOKEN do not trigger tag-push workflows.
      - name: Build native binaries for the published package
        if: steps.publish.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ format('{0}@{1}', fromJSON(steps.publish.outputs.published-packages)[0].name, fromJSON(steps.publish.outputs.published-packages)[0].version) }}
        run: gh workflow run binaries.yml --ref "$TAG" -f dry_run=false
