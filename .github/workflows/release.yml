name: release

# Publishes svgo-mbt to npm when a release pull request lands on main.
#
# Flow: pull requests add changesets (`pnpm changeset`); a release PR runs
# `pnpm version-packages`, which bumps packages/svgo-mbt/package.json and
# CHANGELOG.md and copies the version into the MoonBit modules. Once that PR is
# merged, this workflow builds, tests and runs `changeset publish`, which
# publishes only if the version is not on npm yet and tags the commit
# `svgo-mbt@X.Y.Z`. That tag triggers binaries.yml (native CLI builds, the
# GitHub release and the mooncakes publish).
#
# npm authentication is OIDC trusted publishing (no token in the repo): the
# package's Trusted Publisher on npmjs.com must point at this repository and
# this workflow file. Provenance is attached automatically.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and test, run npm publish --dry-run, tag nothing"
        type: boolean
        default: true

permissions:
  contents: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH
          "$HOME/.moon/bin/moon" update
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: Versions agree across the repo
        run: node scripts/sync-version.mjs --check
      - name: Build the wasm and the JS CLI, run the package tests
        run: |
          pnpm install --frozen-lockfile
          scripts/build-wasm.sh
          scripts/build-cli.sh
          cd packages/svgo-mbt && node --test
      - name: Publish (dry run)
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        working-directory: packages/svgo-mbt
        run: npm publish --ignore-scripts --access public --dry-run
      - name: Publish and tag
        if: github.event_name == 'push' || !inputs.dry_run
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          pnpm changeset publish
          git push --tags
        env:
          NPM_CONFIG_PROVENANCE: "true"
          # Bootstrap only: the first publish creates the package, and only an
          # existing package can be given a Trusted Publisher on npmjs.com.
          # Remove this line (and the secret) once that is configured; npm then
          # authenticates through OIDC.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
