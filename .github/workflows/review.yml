name: Review

on:
  pull_request:
    types: [opened, edited, reopened, synchronize, ready_for_review]
  push:
    branches: [main]

jobs:
  repository-checks:
    name: repository checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: ./scripts/check-repository.sh

  pr-title:
    name: conventional PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: ./scripts/check-pr-title.sh "$PR_TITLE"
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}

  pr-body:
    name: PR description
    # Bot PRs (dependency updates, release PRs) do not use the template; their titles are still checked.
    if: github.event_name == 'pull_request' && github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: printf '%s\n' "$PR_BODY" | ./scripts/check-pr-body.sh
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
