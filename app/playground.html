<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>svgo.mbt playground</title>
<meta name="description" content="Optimize SVGs in your browser with svgo.mbt (MoonBit, WebAssembly). Toggle plugins, set precision, compare before and after.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="nav">
  <div class="wrap flex h-[60px] items-center justify-between">
    <a class="flex items-center gap-2.5 font-display text-[17px] font-bold tracking-[-0.02em]" href="./">
      <svg class="size-[26px]" viewBox="0 0 24 24" aria-hidden="true"><rect width="24" height="24" rx="6" fill="#6d5dfc"/><path d="M7 15.5c1 1.2 2.4 1.8 4 1.8 2.3 0 3.8-1.1 3.8-2.9 0-3.6-7.2-1.6-7.2-5.6C7.6 7.2 9 6 11.2 6c1.5 0 2.8.5 3.7 1.4" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round"/></svg>
      svgo.mbt <small class="font-sans text-[13px] font-medium text-muted">playground</small>
    </a>
    <div class="flex gap-1.5">
      <a class="nav-link" href="./">Home</a>
      <a class="nav-link" href="playground.html" aria-current="page">Playground</a>
      <a class="nav-link" href="api.html">API</a>
      <a class="nav-link" href="https://github.com/PerfectPan/svgo.mbt">GitHub</a>
    </div>
  </div>
</nav>

<div class="grid h-[calc(100vh-61px)] grid-cols-[272px_1fr] max-[900px]:h-auto max-[900px]:grid-cols-1">
  <aside class="overflow-auto border-r border-line bg-bg-2 p-[18px] max-[900px]:border-b max-[900px]:border-r-0">
    <h4 class="mb-2 text-[11px] font-bold uppercase tracking-[0.1em] text-muted">Options</h4>
    <label class="flex items-center justify-between gap-2.5 py-[5px] text-[13px]">precision <input class="w-[60px] rounded-lg border border-line-2 bg-surface px-2 py-1" type="number" id="precision" value="3" min="0" max="8"></label>
    <label class="flex items-center justify-between gap-2.5 py-[5px] text-[13px]">multipass <input class="accent-accent" type="checkbox" id="multipass" checked></label>
    <label class="flex items-center justify-between gap-2.5 py-[5px] text-[13px]">pretty print <input class="accent-accent" type="checkbox" id="pretty"></label>
    <h4 class="mb-2 mt-5 flex items-center justify-between text-[11px] font-bold uppercase tracking-[0.1em] text-muted">Plugins <button class="chip -my-1 normal-case tracking-normal" id="reset">reset</button></h4>
    <div id="plugins" class="text-xs text-muted">loading wasm…</div>
  </aside>

  <main class="grid min-h-0 min-w-0 grid-rows-[auto_1fr_auto]">
    <div class="flex flex-wrap items-center gap-2.5 border-b border-line px-4 py-2.5">
      <select class="rounded-full border border-line-2 bg-surface px-2.5 py-[7px]" id="sample" aria-label="sample">
        <option value="">Samples…</option>
      </select>
      <label class="btn btn-sm" for="file">Open .svg<input id="file" type="file" accept=".svg,image/svg+xml" hidden></label>
      <span class="flex-1"></span>
      <button class="btn btn-sm" id="copy">Copy output</button>
      <button class="btn btn-sm" id="download">Download</button>
      <button class="btn btn-sm" id="share" title="URL with the current input and options">Share link</button>
    </div>
    <div class="grid min-h-0 grid-cols-2 max-[900px]:grid-cols-1">
      <div class="pane">
        <span class="pane-label">input</span>
        <textarea class="!h-auto !min-h-[240px] !flex-1" id="in" spellcheck="false" placeholder="Paste SVG, drop a file, or pick a sample" aria-label="SVG input"></textarea>
        <div class="preview !h-[220px]" id="pin"></div>
      </div>
      <div class="pane border-l border-line max-[900px]:border-l-0 max-[900px]:border-t">
        <span class="pane-label">output</span>
        <textarea class="!h-auto !min-h-[240px] !flex-1" id="out" readonly aria-label="optimized SVG"></textarea>
        <div class="preview !h-[220px]" id="pout"></div>
      </div>
    </div>
    <div class="bg-surface">
      <div class="stats">
        <span class="stat"><b id="s-before">—</b><span>B in</span></span>
        <span class="stat"><b id="s-after">—</b><span>B out</span></span>
        <span class="saved" id="s-saved">—</span>
        <span class="sizebar"><i id="s-bar" style="width:100%"></i></span>
        <span class="stat"><b id="s-ms">—</b><span>ms</span></span>
        <span class="text-[12.5px] text-muted" id="s-applied"></span>
      </div>
    </div>
  </main>
</div>

<script type="module" src="playground.js"></script>
</body>
</html>
