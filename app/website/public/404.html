  /* html[lang] is set by the bootstrap script below, mirroring the same
     localStorage key and fallback the main app's index.html uses, so a
     returning visitor sees the language they last chose rather than both
     at once; English is the default before the script runs. */
  :lang(zh) .en, :lang(en) .zh { display: none; }

     script below), exactly like the main app, not by the system setting */
  [data-theme="dark"] body { color: #f7ede3; background: #1c1613; }
  [data-theme="dark"] p { color: #d8c8bc; }
  [data-theme="dark"] a { color: #ff8a6b; }

  [data-theme="dark"] .nib svg { filter: drop-shadow(2px 0 0 #f7ede3) drop-shadow(-2px 0 0 #f7ede3) drop-shadow(0 2px 0 #f7ede3) drop-shadow(0 -2px 0 #f7ede3); }
</style>
