packages:
  - "packages/*"
  - "app/website"

# pnpm's default, stated so it is not lowered by accident: resolve only
# versions published at least one day (1440 minutes) ago. Wait for a fresh
# release to mature instead of disabling the check.
minimumReleaseAge: 1440

# Dependency build scripts are blocked unless listed here. @parcel/watcher's
# install script only compiles from source on request; the prebuilt platform
# package is used instead.
allowBuilds:
  "@parcel/watcher": false
